<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EffecCol 状态</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="status-body" data-state="idle">
    <div class="shell">
      <div class="card">
        <section class="hero">
          <div class="hero-top">
            <div class="brand-lockup">
              <div class="brand-mark">
                <img src="icons/effective-collection-48.png" alt="EffecCol">
              </div>
              <div class="brand-copy">
                <span class="eyebrow">EffecCol</span>
                <h1 id="statusTitle">等待下一次静默保存</h1>
              </div>
            </div>
          </div>
          <p id="statusMessage">点击扩展图标后，这里会展示最近一次静默保存结果。</p>
          <div class="product-strip">
            <span>Silent Save</span>
            <span>AI Summary</span>
            <span>Clipboard Card</span>
          </div>
        </section>

        <section class="section">
          <div class="section-head">
            <span class="step-badge">状态</span>
            <div>
              <p class="section-title">最近一次结果</p>
              <p class="section-subtitle">这个页面只在失败补救或你主动查看时才有意义，不会再插入主流程。</p>
            </div>
          </div>
          <div class="stack">
            <div class="preview-card">
              <h2>细节</h2>
              <ul id="statusDetails" class="detail-list"></ul>
            </div>
          </div>
        </section>

        <section class="section">
          <div class="actions status-actions compact-actions">
            <button id="retryButton" class="primary" type="button" hidden>重试这次保存</button>
            <button id="settingsButton" class="secondary" type="button">打开设置</button>
          </div>
        </section>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
